<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VIVUM Хроно"><link rel="manifest" href="manifest.webmanifest"><title>VIVUM — Хронометраж</title><style>
:root{--bg:#f5f6f7;--card:#fff;--text:#101214;--muted:#6b7280;--border:#dfe3e8;--accent:#111827;--soft:#eef2f7;--danger:#991b1b;--ok:#166534}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.app{max-width:560px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}h1{font-size:22px;margin:0 0 4px}.sub,.small,.note{color:var(--muted);font-size:13px}.note{line-height:1.35}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 5px}input,select,textarea,button{width:100%;font:inherit;font-size:16px;border-radius:12px;min-height:48px}input,select,textarea{border:1px solid var(--border);background:#fff;padding:11px 12px}textarea{min-height:72px}button{border:0;background:var(--accent);color:#fff;font-weight:700;padding:11px 14px}button.secondary{background:var(--soft);color:var(--text);border:1px solid var(--border)}button.danger{background:var(--danger)}button.ok{background:var(--ok)}button:disabled{opacity:.45}.row,.stats,.actions,.stage-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.timer{font-size:38px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}.stat{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:10px}.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--muted)}.stage-grid button{background:#fff;color:var(--text);border:1px solid var(--border);font-weight:600}.stage-grid button.active{background:var(--accent);color:#fff}.pause{display:none}.pause.show{display:block}.badge{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 8px;font-size:12px;margin:2px 4px 2px 0}.history-item{border-top:1px solid var(--border);padding:10px 0}.history-item:first-child{border-top:0}.status{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}@media(max-width:380px){.row,.stats,.actions,.stage-grid{grid-template-columns:1fr}.timer{font-size:34px}}
</style></head><body><main class="app"><h1>VIVUM — Хронометраж</h1><div class="sub">Пилот · электромонтажные работы</div>
<section class="card"><label>Рабочий пакет</label><input id="packageName" placeholder="1 этаж · спальни · 24 подрозетника"><div class="row"><div><label>Исполнитель</label><input id="worker" placeholder="ФИО / бригада"></div><div><label>Количество единиц</label><input id="qty" type="number" inputmode="numeric" min="1" value="1"></div></div><label>Тип работы</label><select id="workType"><option>Черновой монтаж электроточки</option><option>Прокладка кабеля</option><option>Монтаж подрозетников</option><option>Монтаж/сборка щита</option><option>Чистовой монтаж розеток/выключателей</option><option>Монтаж светильников</option><option>Монтаж датчиков</option><option>Другое</option></select></section>
<section class="card"><div class="small" style="text-align:center">Общее время пакета</div><div class="timer" id="timer">00:00:00</div><div class="stats"><div class="stat"><b id="productive">00:00:00</b><span>производительное</span></div><div class="stat"><b id="loss">00:00:00</b><span>потери / паузы</span></div></div><div id="status" class="status">Пакет не запущен</div><div class="actions" style="margin-top:10px"><button id="start">Старт</button><button id="pauseBtn" class="secondary" disabled>Пауза / простой</button></div><div id="pauseBox" class="pause"><label>Причина паузы</label><select id="pauseReason"><option>Нет материала</option><option>Нет инструмента / оснастки</option><option>Нет доступа</option><option>Мешают смежники</option><option>Нет решения / чертежа</option><option>Переделка</option><option>Неисправность оборудования</option><option>Перерыв</option><option>Иное</option></select><button id="confirmPause" class="danger" style="margin-top:8px">Начать паузу</button></div></section>
<section class="card"><label>Текущий этап</label><div id="stages" class="stage-grid"><button data-stage="Подготовка">Подготовка</button><button data-stage="Разметка">Разметка</button><button data-stage="Отверстия">Отверстия</button><button data-stage="Подрозетники">Подрозетники</button><button data-stage="Кабели">Кабели</button><button data-stage="Контроль">Контроль</button><button data-stage="Завершение">Завершение</button><button data-stage="Другое">Другое</button></div><div class="note" style="margin-top:8px">Нажатие фиксирует время предыдущего этапа и запускает следующий.</div></section>
<section class="card"><label>Комментарий</label><textarea id="comment" placeholder="Условия, причины отклонений, замечания"></textarea><div class="actions" style="margin-top:10px"><button id="resume" class="ok" disabled>Продолжить</button><button id="finish" class="danger" disabled>Завершить пакет</button></div></section>
<section class="card"><div class="actions"><button id="export" class="secondary">Экспорт CSV</button><button id="clear" class="secondary">Очистить историю</button></div><div class="note" style="margin-top:8px">Данные хранятся только на этом устройстве. Сервер не требуется.</div></section>
<section class="card"><b>Последние пакеты</b><div id="history"></div></section></main>
<script>(function(){const $=x=>document.getElementById(x),btns=[...document.querySelectorAll('[data-stage]')],HK='vivumHistoryV1',SK='vivumStateV1';let s={running:false,paused:false,total:0,prod:0,loss:0,last:null,stage:null,stageStart:null,stageTimes:{},pauseStart:null,pauseReason:null,pauses:[]},timer=null;const now=()=>Date.now(),fmt=ms=>{let q=Math.floor((ms||0)/1000),h=Math.floor(q/3600),m=Math.floor((q%3600)/60),z=q%60;return[h,m,z].map(v=>String(v).padStart(2,'0')).join(':')};function save(){localStorage.setItem(SK,JSON.stringify(s))}function hist(){try{return JSON.parse(localStorage.getItem(HK)||'[]')}catch{return[]}}function setHist(h){localStorage.setItem(HK,JSON.stringify(h));render()}function tick(){if(!s.running)return;let t=now(),d=t-(s.last||t);s.last=t;s.total+=d;s.paused?s.loss+=d:s.prod+=d;$('timer').textContent=fmt(s.total);$('productive').textContent=fmt(s.prod);$('loss').textContent=fmt(s.loss);save()}function runTicker(){clearInterval(timer);s.last=now();timer=setInterval(tick,1000)}function sync(){$('timer').textContent=fmt(s.total);$('productive').textContent=fmt(s.prod);$('loss').textContent=fmt(s.loss);$('start').disabled=s.running;$('pauseBtn').disabled=!s.running||s.paused;$('resume').disabled=!s.running||!s.paused;$('finish').disabled=!s.running;btns.forEach(b=>{b.disabled=!s.running||s.paused;b.classList.toggle('active',b.dataset.stage===s.stage)});$('status').textContent=!s.running?'Пакет не запущен':s.paused?'Пауза: '+s.pauseReason:s.stage?'В работе: '+s.stage:'Пакет запущен — выберите этап'}function start(){if(!$('packageName').value.trim())return alert('Укажите рабочий пакет.');s={running:true,paused:false,total:0,prod:0,loss:0,last:now(),stage:null,stageStart:null,stageTimes:{},pauseStart:null,pauseReason:null,pauses:[],started:now()};runTicker();sync();save()}function stage(name){if(!s.running||s.paused)return;let t=now();if(s.stage&&s.stageStart)s.stageTimes[s.stage]=(s.stageTimes[s.stage]||0)+(t-s.stageStart);s.stage=name;s.stageStart=t;sync();save()}function pause(){if(!s.running||s.paused)return;$('pauseBox').classList.toggle('show')}function confirmPause(){let t=now();if(s.stage&&s.stageStart){s.stageTimes[s.stage]=(s.stageTimes[s.stage]||0)+(t-s.stageStart);s.stageStart=null}s.paused=true;s.pauseReason=$('pauseReason').value;s.pauseStart=t;$('pauseBox').classList.remove('show');sync();save()}function resume(){if(!s.paused)return;let t=now();s.pauses.push({reason:s.pauseReason,ms:t-s.pauseStart});s.paused=false;s.pauseReason=null;s.pauseStart=null;if(s.stage)s.stageStart=t;sync();save()}function finish(){if(!s.running)return;tick();let t=now();if(s.paused&&s.pauseStart)s.pauses.push({reason:s.pauseReason,ms:t-s.pauseStart});else if(s.stage&&s.stageStart)s.stageTimes[s.stage]=(s.stageTimes[s.stage]||0)+(t-s.stageStart);let q=Math.max(1,parseInt($('qty').value||'1')),r={date:new Date(s.started).toISOString(),packageName:$('packageName').value.trim(),worker:$('worker').value.trim(),qty:q,workType:$('workType').value,comment:$('comment').value.trim(),total:s.total,prod:s.prod,loss:s.loss,perUnit:s.prod/q,stageTimes:s.stageTimes,pauses:s.pauses};let h=hist();h.unshift(r);setHist(h.slice(0,200));clearInterval(timer);localStorage.removeItem(SK);s={running:false,paused:false,total:0,prod:0,loss:0,last:null,stage:null,stageStart:null,stageTimes:{},pauseStart:null,pauseReason:null,pauses:[]};$('comment').value='';sync()}function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let h=hist();$('history').innerHTML=h.length?h.slice(0,10).map(r=>`<div class="history-item"><b>${esc(r.packageName)}</b><div class="small">${new Date(r.date).toLocaleString('ru-RU')} · ${esc(r.workType)}</div><div><span class="badge">всего ${fmt(r.total)}</span><span class="badge">работа ${fmt(r.prod)}</span><span class="badge">потери ${fmt(r.loss)}</span><span class="badge">${r.qty} ед.</span></div></div>`).join(''):'<div class="small" style="padding-top:8px">История пока пуста.</div>'}function csvQ(v){return '"'+String(v??'').replaceAll('"','""')+'"'}function exportCSV(){let h=hist();if(!h.length)return alert('Нет данных для экспорта.');let rows=[['Дата','Пакет','Исполнитель','Тип','Количество','Всего сек','Работа сек','Потери сек','На единицу сек','Этапы','Паузы','Комментарий']];h.forEach(r=>rows.push([r.date,r.packageName,r.worker,r.workType,r.qty,Math.round(r.total/1000),Math.round(r.prod/1000),Math.round(r.loss/1000),Math.round(r.perUnit/1000),Object.entries(r.stageTimes||{}).map(([k,v])=>k+': '+Math.round(v/1000)+'с').join(' | '),(r.pauses||[]).map(p=>p.reason+': '+Math.round(p.ms/1000)+'с').join(' | '),r.comment]));let blob=new Blob(['﻿'+rows.map(x=>x.map(csvQ).join(';')).join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='VIVUM_хронометраж_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('start').onclick=start;$('pauseBtn').onclick=pause;$('confirmPause').onclick=confirmPause;$('resume').onclick=resume;$('finish').onclick=finish;$('export').onclick=exportCSV;$('clear').onclick=()=>{if(confirm('Удалить всю историю?')){localStorage.removeItem(HK);render()}};btns.forEach(b=>b.onclick=()=>stage(b.dataset.stage));try{let old=JSON.parse(localStorage.getItem(SK)||'null');if(old){s=old;if(s.running&&s.last){let d=now()-s.last;s.total+=d;s.paused?s.loss+=d:s.prod+=d;runTicker()}}}catch{}render();sync();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});})();</script></body></html>
